name: Release MSI

# cdp-agent の Windows MSI (cargo-wix) を作って Release に添付する (cdp-relay#12 M6b)。
# tag は release-rust.yml と同じ cdp-agent-* を受け、同 tag の Release に asset を足す。
# cloudflared.exe を同梱する。自動更新は agent 内蔵 self-update (M6a) が担う。
#
# NOTE: MSI ビルドは CCoW で検証できず windows-latest + WiX toolset 依存。cargo-wix の
# フラグ (--install-version / --output 等) や CargoTargetBinDir 解決は初回 CI で要調整。

on:
  push:
    tags:
      - 'cdp-agent-v*'
      - 'cdp-agent-dev-*'

permissions:
  contents: write

jobs:
  msi:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build cdp-agent (release)
        env:
          CDP_AGENT_RELEASE_TAG: ${{ github.ref_name }}
        run: cargo build --release --locked -p cdp-agent

      - name: Bundle cloudflared.exe (CargoTargetBinDir に配置)
        shell: bash
        run: |
          curl -sSL -o target/release/cloudflared.exe \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe

      - name: Bundle MV3 extension (manifest stamp + CargoTargetBinDir\extension に配置)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p target/release/extension
          cp ../extension/manifest.json ../extension/background.js \
             ../extension/popup.html ../extension/popup.js \
             target/release/extension/
          # cdp-agent-dev-14 -> 0.0.14 (agent version と揃える)。manifest version を
          # stamp して popup の version 表示 / self-update 比較を機能させる。
          N="${TAG##*-}"; VER="0.0.${N}"
          VER="$VER" node -e "const fs=require('fs');const p='target/release/extension/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          echo "extension manifest version -> ${VER}"

      - name: Compute MSI version (dev-N -> 0.0.N)
        id: ver
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" =~ ^cdp-agent-dev-([0-9]+)$ ]]; then
            echo "version=0.0.${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^cdp-agent-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build MSI (no rebuild, reuse target/release)
        run: >
          cargo wix --package cdp-agent --no-build --nocapture
          --install-version ${{ steps.ver.outputs.version }}
          --output target/wix/cdp-agent-${{ steps.ver.outputs.version }}-x86_64.msi

      - name: Package extension zip (self-update 用)
        # windows-latest に zip コマンドが無いので PowerShell の Compress-Archive を使う。
        # asset 名 prefix は update.rs の pick_latest_extension が探す cdp-relay-extension- に揃える。
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "cdp-relay-extension-$env:TAG.zip"
          # target/release/extension の中身を flat に固める (chrome unpacked 読込用)。
          Compress-Archive -Path "target/release/extension/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash" | Out-File -Encoding ascii "$zip.sha256"
          Get-Item $zip

      - name: Upload MSI + extension zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          # `-` を含む tag (cdp-agent-dev-N) は prerelease。release-rust.yml の
          # Detect prerelease と挙動を揃える。揃えないと dev-* が非 prerelease で
          # 作られ "Latest" を奪う (cdp-agent-dev-9 が Latest に居座る事象)。
          # stable tag (cdp-agent-v*) は非 prerelease のまま → Latest になる。
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            rust/target/wix/*.msi
            rust/cdp-relay-extension-*.zip
            rust/cdp-relay-extension-*.zip.sha256
          fail_on_unmatched_files: true
