name: Release Rust agent

# cdp-agent を GitHub Release に配布する。rust-dev-tag.yml が打つ `cdp-agent-dev-N`
# (dev prerelease)、および手動 `cdp-agent-v*` (stable) を受ける。
#
# - working_directory: rust で subdir workspace をビルド (ci-workflows#110)。
# - tag_strip_prefix で asset 名の prefix doubling を防ぐ
#   (`cdp-agent-dev-1` → strip `cdp-agent-` → `cdp-agent-dev-1-<target>`)。
# - `-` を含む tag (dev-*) は reusable 側で自動 prerelease。
# - worker の `v*` タグとは prefix で分離済み (ci.yml は `v*` のみ deploy)。

on:
  push:
    tags:
      - 'cdp-agent-v*'
      - 'cdp-agent-dev-*'

permissions:
  contents: write

jobs:
  release:
    uses: ippoan/ci-workflows/.github/workflows/rust-binary-release.yml@main
    with:
      working_directory: rust
      bin_name: cdp-agent
      package: cdp-agent
      tag_strip_prefix: cdp-agent-
      # 手元 agent は Windows / Linux 両方で動かす。Release に両 target を添付する。
      targets: |
        [
          {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-latest","archive":"tar.gz"},
          {"target":"x86_64-pc-windows-msvc","os":"windows-latest","archive":"zip","ext":".exe"}
        ]
    # 各 archive を minisign 署名して `<asset>.minisig` を Release に添付する (#20)。
    # agent の self-update は DL した zip をこの署名で検証してから self_replace する。
    # 公開鍵は agent に hard-code、秘密鍵は secret-inject で投入した org secret。
    secrets:
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    permissions:
      contents: write
