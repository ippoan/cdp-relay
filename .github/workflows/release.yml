name: Release Extension (dev)

# cdp-relay の MV3 拡張 (extension/) を **dev prerelease** として GitHub Releases に
# 配布する。ippoan/HealthConnectReader の release.yml を参考にした「push で自動 dev
# release」pattern の拡張版 (APK → extension zip に置換)。
#
# - 常に patch を進める: tag は `v<package.json の major.minor>.<run_number>-dev`
#   (patch 位置 = run_number で毎回インクリメント)。
# - 常に dev タグ: `-dev` 付き = semver prerelease。GitHub の releases/latest に
#   出ないので安定 consumer に影響しない (prerelease: true も明示)。
# - worker 本体の deploy は ci.yml (frontend-ci) が main push で行う。本 workflow は
#   GitHub Release (拡張の配布) だけを担う。GITHUB_TOKEN で打つ tag は ci.yml の
#   tags トリガを発火させない (= 二重 deploy しない)。

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute dev tag (patch = run_number)
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # package.json の major.minor を base に、patch を run_number で常に進める。
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          TAG="v${BASE}.${RUN_NUMBER}-dev"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed dev tag: ${TAG}"

      - name: Stamp manifest version from tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # v0.1.5-dev -> 0.1.5 (manifest version は数値.数値.数値)
          VER="${TAG#v}"; VER="${VER%-dev}"
          VER="$VER" node -e "const fs=require('fs');const p='extension/manifest.json';const m=JSON.parse(fs.readFileSync(p));m.version=process.env.VER;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n')"
          echo "manifest version -> ${VER}"

      - name: Package extension/ as zip
        id: pkg
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP="cdp-relay-extension-${TAG}.zip"
          (cd extension && zip -r "../${ZIP}" . -x '.DS_Store' -x '*/.DS_Store')
          sha256sum "${ZIP}" | awk '{print $1}' > "${ZIP}.sha256"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cat "${ZIP}.sha256")" >> "$GITHUB_OUTPUT"

      - name: Compose release body
        env:
          ZIP: ${{ steps.pkg.outputs.zip }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          {
            echo ""
            echo "## cdp-relay MV3 拡張 (dev)"
            echo ""
            echo "手元 Chrome に load する拡張の dev ビルド。**prerelease (dev チャネル)** です。"
            echo ""
            echo "### インストール"
            echo ""
            echo "1. \`${ZIP}\` を DL して展開"
            echo "2. \`chrome://extensions\` → デベロッパーモード ON → 「パッケージ化されていない拡張機能を読み込む」で展開先を選択"
            echo "3. popup で Relay URL / session / token / 対象タブ を設定して接続"
            echo ""
            echo "- sha256: \`${SHA}\`"
          } > /tmp/release-body.md
          cat /tmp/release-body.md

      - name: Create dev prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: true
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
          generate_release_notes: true
          body_path: /tmp/release-body.md
          append_body: true
