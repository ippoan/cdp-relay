[package]
name = "cdp-agent"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "手元マシンで cf quick tunnel を張り、/mcp (MCP server) と echo を tunnel 先に出す PoC agent (cdp-relay#12)"

# M1 は依存ゼロ (std) だったが、M5 で /mcp を MCP server 化したため tiny_http + serde_json
# を入れる。HTTP body の正しい読み取りと JSON-RPC のために必要。CDP 実体は M2 (NM 経由で
# 拡張の chrome.debugger) で差し込む。
[dependencies]
tiny_http = "0.12"
serde_json = "1"
