[package]
name = "cdp-prober"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CCoW から手元 agent の quick tunnel URL に 443 で到達できるか確認する PoC prober (cdp-relay#12 M1)"

# in-process で HTTPS GET する。これは将来 CCoW proxy が tunnel_url に MCP 転送する際の
# HTTP client の素振りでもある。ureq + rustls で OS TLS / openssl 非依存。
[dependencies]
ureq = "2"
