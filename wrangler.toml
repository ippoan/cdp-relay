name = "cdp-relay"
main = "src/index.ts"
# crypto.subtle (HMAC token 比較) / SqlStorage / WebSocketPair はすべて標準
# Workers API なので nodejs_compat は本来不要だが、MCP SDK が node 互換を期待する
# 箇所に備えて ui-preview / ref-files-worker と同じ compat date に固定しておく。
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
# 他 ippoan worker と同じアカウント。
account_id = "24b45709d060d957340180e995f0d373"

# workers.dev サブドメイン (cdp-relay.<subdomain>.workers.dev) で疎通させる。
# 初回 PR は custom domain を張らず workers.dev のみで deploy する (下の routes は
# 後続 PR で有効化)。
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# ─── Secret: RELAY_TOKEN (拡張用、CF Secrets Store binding) ───────────────────
# 拡張 WS (/ext) + screenshot 投入 (/shot PUT) の shared secret。ブラウザ拡張は
# MCP-JWT を mint できないので shared secret で受ける。CDP は無認証なので漏れると
# 任意 JS eval = ブラウザ乗っ取り。値は secret-inject skill で CF Secrets Store +
# GCP (SoT) に投入済み (context/log 非露出)。
#
# `[secrets] required` は **使わない**: wrangler 4.79+ はこれを worker-scoped
# secret 宣言と解釈し、binding 名が未 set だと "required secret not set" で
# deploy が落ちる (Refs ippoan/mcp-relay-rs#21、HealthConnectReaderWorker と同様)。
# 代わりに secrets_store_secrets binding で受け、secret-verify-gcp は
# secrets_store_secrets[*].secret_name を自動抽出して GCP と突合する。
[[secrets_store_secrets]]
binding = "RELAY_TOKEN"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "RELAY_TOKEN"

# ─── Secret: MCP_JWT_SECRET (/mcp の MCP-JWT 検証鍵) ──────────────────────────
# /mcp は ippoan 標準の MCP-JWT 認証 (ref-files-worker と同方式)。auth-worker が
# MCP-JWT を署名する INTERNAL_SHARED_SECRET と同値を bind する (= 既存 CF Secrets
# Store / GCP に在るので新規投入不要)。これで /mcp は hook の自動 attach に乗り、
# 生の RELAY_TOKEN を ~/.claude.json に置かずに済む。
[[secrets_store_secrets]]
binding = "MCP_JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# ─── 設定値 (文字列 vars。未設定なら src/env.ts の default) ───────────────────
[vars]
# /mcp で受理する MCP-JWT の aud。"*" で aud 不問 (connector が可変 aud を mint)。
MCP_JWT_AUDIENCE = "*"
# /cmd 1 往復のタイムアウト (ms)。拡張が応答しなければ 504 cdp_timeout。
CMD_TIMEOUT_MS = "30000"
# screenshot 一時保存の TTL (秒)。GET 時に超過なら 410、PUT 時に古い分を掃除。
SHOT_TTL_SECONDS = "300"
# shot_url を組み立てる公開オリジン。空ならリクエスト元 (拡張が叩いた host)。
RELAY_ORIGIN = ""

# ─── Durable Object: 1 session = 1 DO (idFromName(session)) ───────────────────
# 拡張 WS を hibernatable に hold し、/cmd の CDP コマンドを id 相関で往復させ、
# screenshot を SQLite に一時保存する。
[[durable_objects.bindings]]
name = "BROWSER_DO"
class_name = "BrowserSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BrowserSessionDO"]

# Custom domain (control 面) は後続 PR で有効化する。初回は workers.dev のみ。
# [[routes]]
# pattern = "cdp-relay.ippoan.org"
# custom_domain = true
